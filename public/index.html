<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Acta de Instalacion - Fibra Optica e Internet</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="cabecera">
  <div class="cabecera-marca">
    <div class="logo-marco">
      <img src="/logo.png" alt="Logo DUSK" class="logo-empresa" />
    </div>
    <div>
      <h1>INSTALACION DE FIBRA OPTICA E INTERNET</h1>
      <p>Corporación H&amp;D S.A.</p>
    </div>
  </div>
</header>

<main class="contenedor">

  <!-- Pantalla 1: inicio -->
  <section id="pantalla-idioma" class="pantalla pantalla-centrada">
    <div class="hero-inicio">
      <h2 id="texto-seleccion-idioma">Seleccione el tipo de acta</h2>
      <p id="texto-intro">Elija si va a firmar instalacion o reparacion del servicio.</p>
    </div>
    <div class="botonera-idioma">
      <button id="btn-tipo-instalacion" class="boton boton-grande" type="button">Instalacion</button>
      <button id="btn-tipo-reparacion" class="boton boton-grande" type="button">Reparacion</button>
    </div>
  </section>

  <!-- Pantalla 2: documento + formulario + firma -->
  <section id="pantalla-reglamento" class="pantalla" hidden>
    <div class="tarjeta">
      <div class="encabezado-reglamento">
        <div>
          <h2 id="titulo-hotel"></h2>
          <p id="subtitulo-empresa"></p>
        </div>
      </div>
      <h3 id="titulo-documento" class="titulo-documento"></h3>

      <div id="secciones-reglamento" class="secciones"></div>

      <h4 id="titulo-declaracion" class="titulo-declaracion">Declaración de Aceptación</h4>
      <p id="texto-declaracion" class="texto-declaracion"></p>

      <form id="formulario-firma" class="formulario">
        <div class="campo">
          <label id="label-nombre" for="input-nombre"></label>
          <input id="input-nombre" type="text" maxlength="120" autocomplete="off" />
        </div>
        <div class="campo">
          <label id="label-documento" for="input-documento"></label>
          <input id="input-documento" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="60" autocomplete="off" />
        </div>
        <div class="campo">
          <label id="label-direccion" for="input-direccion"></label>
          <input id="input-direccion" type="text" maxlength="180" autocomplete="off" required />
        </div>

        <div id="campo-problema" class="campo" hidden>
          <label id="label-problema" for="input-problema"></label>
          <input id="input-problema" type="text" maxlength="240" autocomplete="off" />
        </div>

        <div id="campo-cambio-router" class="campo campo-checkbox" hidden>
          <input id="check-cambio-router" type="checkbox" />
          <label id="label-cambio-router" for="check-cambio-router"></label>
        </div>

        <div class="campo campo-checkbox">
          <input id="check-aceptacion" type="checkbox" />
          <label id="label-aceptacion" for="check-aceptacion"></label>
        </div>

        <div class="campo">
          <label id="label-firma" class="label-firma"></label>
          <canvas id="canvas-firma" class="canvas-firma"></canvas>
          <button id="btn-limpiar-firma" class="boton boton-secundario" type="button"></button>
        </div>

        <p id="mensaje-error" class="mensaje-error" hidden></p>

        <button id="btn-firmar" class="boton boton-grande boton-firmar" type="button"></button>
      </form>
    </div>
  </section>

  <!-- Pantalla 3: éxito -->
  <section id="pantalla-exito" class="pantalla pantalla-centrada" hidden>
    <div class="tarjeta tarjeta-exito">
      <h2 id="exito-titulo"></h2>
      <p id="exito-texto"></p>
      <div class="botonera-exito">
        <a id="btn-descargar-pdf" class="boton boton-grande" href="#" target="_blank" rel="noopener"></a>
        <button id="btn-nuevo-documento" class="boton boton-grande boton-secundario" type="button"></button>
      </div>
    </div>
  </section>

</main>

<footer class="pie">
  <a href="/admin.html">Ver documentos firmados</a>
</footer>

<script src="/vendor/signature_pad.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
